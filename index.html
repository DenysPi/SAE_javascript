<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeu de Memory</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" type="module"></script>
</head>
<body>
<header><h1>Jeu de Memory</h1></header>

<div class="setup-form">
  <h2>Démarrer une nouvelle partie</h2>

  <form class="game-form" >
    <div class="form-left">
      <label for="name">Nom du joueur</label>
      <input type="text" id="name" required>

      <label for="difficulty">Niveau De Difficulté</label>
      <select id="difficulty">
        <option value="4">Facile</option>
        <option value="6">Moyen</option>
        <option value="8">Difficile</option>
      </select>

      <label for="collection">Collection d'images</label>
      <select id="collection">
        <option value="animals">Animaux</option>
        <option value="fruits">Fruits</option>
        <option value="cars">Voitures</option>
      </select>

      <div class="buttons">
        <button id="btn-solo" type="button">Jouer</button>
        <button id="btn-create" type="button">Créer salle</button>
      </div>
    </div>

    <div class="form-right">
      <div class="form-right-bottom">
        <label for="room-code">Code de la salle</label>
        <div class="room-input-group">
          <input type="text" id="room-code" placeholder="12345">
          <button id="btn-join" type="button">Rejoindre</button>
        </div>
      </div>
    </div>
    
  </form>
</div>

<div class="game-area hidden">
  <div class="game-area-header">
    <h2 id="name"></h2>
    <button id="abandon">Quitter la partie</button>
    <div class="game-timer">0s</div>
  </div>
  <div class="game-board"></div>
</div>
</body>
</html>


<div class="waiting-area hidden">
  <div class="waiting-area-header">
      <h2>En attente d'un adversaire</h2>
      <div class="waiting-code"></div>
  </div>
  <div class="spinner">

  </div>

  <button id="btn-cancel">Annuler</button>
</div>
